# Software Hub Pool — runs alongside n8n / seekhbo behind your existing Traefik.
# Nothing else is touched. The app sits on its OWN network (shp_web); Traefik
# (Docker provider) discovers it by label and routes your domain to it, exactly
# like seekhbo does with seekhbo_default.
#
# Fill deploy/.env (deploy/vps-docker.sh does this) then:  docker compose up -d --build

services:
  shp-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shp
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: shp
    volumes:
      - shp-db-data:/var/lib/postgresql/data
    networks:
      - internal

  shp-app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: "https://${DOMAIN}"
        NEXT_PUBLIC_SUPPORT_EMAIL: "${SUPPORT_EMAIL}"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://shp:${DB_PASSWORD}@shp-db:5432/shp"
      NEXT_PUBLIC_SITE_URL: "https://${DOMAIN}"
      NEXT_PUBLIC_SUPPORT_EMAIL: "${SUPPORT_EMAIL}"
      CODE_HASH_SALT: "${CODE_HASH_SALT}"
      CODE_ENCRYPTION_KEY: "${CODE_ENCRYPTION_KEY}"
      AUTH_SECRET: "${AUTH_SECRET}"
      CRON_SECRET: "${CRON_SECRET}"
      # Demo mode — remove both when you add Razorpay + email/SMS keys.
      ALLOW_MOCK_GATEWAY: "true"
      ALLOW_DEV_OTP: "true"
    depends_on:
      - shp-db
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shp_web"
      - "traefik.http.routers.shp.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.shp.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.shp.tls=true"
      - "traefik.http.routers.shp.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.shp.loadbalancer.server.port=3000"

networks:
  internal:
  web:
    name: shp_web

volumes:
  shp-db-data:
