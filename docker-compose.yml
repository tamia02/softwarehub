# Software Hub Pool — runs alongside n8n / seekhbo behind your existing Traefik.
# Nothing else is touched. The app sits on its OWN network (shp_web); Traefik
# (Docker provider) discovers it by label and routes your domain to it, exactly
# like seekhbo does with seekhbo_default.
#
# Fill deploy/.env (deploy/vps-docker.sh does this) then:  docker compose up -d --build

services:
  shp-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shp
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: shp
    volumes:
      - shp-db-data:/var/lib/postgresql/data
    networks:
      - internal

  shp-app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: "https://${DOMAIN}"
        NEXT_PUBLIC_SUPPORT_EMAIL: "${SUPPORT_EMAIL}"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Bind to every interface — the container is on two networks and Next's
      # standalone server otherwise binds only to its hostname (wrong one), so
      # Traefik on shp_web can't reach it (502).
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: "postgresql://shp:${DB_PASSWORD}@shp-db:5432/shp"
      NEXT_PUBLIC_SITE_URL: "https://${DOMAIN}"
      NEXT_PUBLIC_SUPPORT_EMAIL: "${SUPPORT_EMAIL}"
      CODE_HASH_SALT: "${CODE_HASH_SALT}"
      CODE_ENCRYPTION_KEY: "${CODE_ENCRYPTION_KEY}"
      AUTH_SECRET: "${AUTH_SECRET}"
      CRON_SECRET: "${CRON_SECRET}"
      # Demo mode — remove both when you add Razorpay + email/SMS keys.
      ALLOW_MOCK_GATEWAY: "true"
      ALLOW_DEV_OTP: "true"
      # WhatsApp/vending bot (vending-deep-agent) — server-side only, never exposed
      # to the browser. Reached over the vending-bot_default Docker network.
      VENDING_API_URL: "${VENDING_API_URL:-http://vending-deep-agent:5000}"
      VENDING_ADMIN_TOKEN: "${VENDING_ADMIN_TOKEN:-}"
      # Lucifer bot internal API (catalog, wallets, orders) — server-side only,
      # reached over the bot's Docker network, never exposed to the browser.
      LUCIFER_API_URL: "${LUCIFER_API_URL:-http://lucifer-bot-live-bot-1:8092}"
      LUCIFER_INTERNAL_KEY: "${LUCIFER_INTERNAL_KEY:-}"
      LUCIFER_BOT_TOKEN: "${LUCIFER_BOT_TOKEN:-}"
      LUCIFER_BOT_USERNAME: "${LUCIFER_BOT_USERNAME:-DevilLucifer777_bot}"
      # "Continue with Google" — set both to enable the button (Google Cloud → OAuth client,
      # redirect URI https://<domain>/api/auth/google/callback).
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
    depends_on:
      - shp-db
    networks:
      - internal
      - web
      - lucifer
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shp_web"
      - "traefik.http.routers.shp.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.shp.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.shp.tls=true"
      - "traefik.http.routers.shp.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.routers.shp.service=shp"
      # www and the legacy host get their own routers (and certificates), so a
      # host whose DNS isn't pointed here yet can never break the main cert.
      - "traefik.http.routers.shp-www.rule=Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.shp-www.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.shp-www.tls=true"
      - "traefik.http.routers.shp-www.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.routers.shp-www.service=shp"
      - "traefik.http.routers.shp-legacy.rule=Host(`${LEGACY_DOMAIN:-pool.softwarehub.tech}`)"
      - "traefik.http.routers.shp-legacy.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.shp-legacy.tls=true"
      - "traefik.http.routers.shp-legacy.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.routers.shp-legacy.service=shp"
      - "traefik.http.services.shp.loadbalancer.server.port=3000"

networks:
  internal:
  web:
    name: shp_web
  # The Lucifer bot's compose network (/docker/lucifer-bot-live), joined so the
  # app can reach the bot's internal API by container name.
  lucifer:
    name: lucifer-bot-live_default
    external: true

volumes:
  shp-db-data:
